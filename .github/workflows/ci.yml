name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all test suites
        run: |
          status=0
          for suite in tests/*.sh; do
            echo "=== $suite ==="
            bash "$suite" || status=1
          done
          exit $status
